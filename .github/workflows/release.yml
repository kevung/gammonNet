# Publier l'artefact — poids, WebAssembly, API, et de quoi le vérifier.
#
# CE QUE CE WORKFLOW GARANTIT, ET CE QU'IL REFUSE
#
# `tools/package_artifact.py` traite les cinq conditions de T50 comme des
# conditions : il rejoue le corpus de non-régression AVANT d'écrire quoi que ce
# soit, et refuse de produire un répertoire incomplet. Ce workflow s'appuie
# dessus plutôt que de les revérifier autrement — une seconde définition de
# « publiable » finirait par diverger de la première.
#
# LES POIDS NE SONT PAS DANS LE DÉPÔT. `models/*.bin` est gitignoré : les poids
# viennent du dépôt vendoré d'Alexander Strehl, à un commit épinglé par
# `tools/fetch_vendor.py`. La CI les reconstruit donc, ce qui a un mérite
# secondaire : elle vérifie à chaque publication que la chaîne d'export
# fonctionne encore.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version de l'artefact (ex. v1)"
        required: true
        default: "v1"

permissions:
  contents: write

jobs:
  artefact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64
          actions-cache-folder: emsdk-cache

      - name: GNU Backgammon
        # L'oracle n'est pas nécessaire pour PUBLIER — il l'est pour mesurer.
        # `ORACLE=0` évite d'installer `gnubg-nn` ici.
        run: sudo apt-get update && sudo apt-get install -y gnubg

      - name: Dépendances Python
        run: |
          python -m pip install --upgrade pip
          # La roue CPU : torque ne sert qu'à convertir les poids, et la roue
          # CUDA pèserait dix fois plus pour rien.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy pytest

      - name: Sources vendorées, au commit épinglé
        run: python tools/fetch_vendor.py

      - name: Poids
        run: python tools/export_model.py

      - name: Réseau d'élagage
        # Distillé du grand réseau ; le corpus se régénère par sa graine.
        run: |
          python tools/build_prune_corpus.py --count 800000 --workers 2
          python tools/train_prune.py

      - name: Bibliothèque native
        run: make build

      - name: WebAssembly, scalaire et SIMD
        run: make wasm

      - name: Parité WebAssembly ↔ natif
        # AVANT tout le reste : un artefact dont le module ne répond pas comme
        # le moteur natif ne doit pas sortir, quels que soient ses autres
        # mérites.
        run: make wasm-parity

      - name: Tests
        run: python -m pytest tests/ -q

      - name: Assembler
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          python tools/package_artifact.py --version "$VERSION"

      - name: Archive
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          cd dist && tar czf "gammonnet-$VERSION.tar.gz" "gammonnet-$VERSION"
          sha256sum "gammonnet-$VERSION.tar.gz" | tee "gammonnet-$VERSION.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: gammonnet-artefact
          path: dist/

      - name: Publier la release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          body_path: dist/gammonnet-${{ github.ref_name }}/RELEASE.md
