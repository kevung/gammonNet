# Publier la documentation sur GitHub Pages.
#
# Deux projets Sphinx, un par langue, plutôt qu'un catalogue de traduction : le
# contenu est écrit à la main dans les deux langues, et un `.po` ferait croire à
# une traduction automatique qu'il faudrait maintenir.
#
# `-W` transforme tout avertissement en erreur. Une référence cassée ou une
# directive inconnue arrête la publication au lieu de produire une page à
# moitié rendue — une documentation dont on ne peut pas suivre les liens ne
# remplit pas son office.

name: pages

on:
  push:
    branches: ["main"]
    paths:
      - "docs/site/**"
      - ".github/workflows/pages.yml"
      - "requirements-docs.txt"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          # Sans ce chemin, l'action cherche `requirements.txt` ou
          # `pyproject.toml`, ne les trouve pas, et ÉCHOUE — ce qui est arrivé
          # au premier passage.
          cache-dependency-path: requirements-docs.txt

      - name: Dépendances
        # La documentation se construit SANS le moteur : ni compilateur, ni
        # poids, ni Emscripten. C'est ce qui la rend rapide à publier et
        # indépendante de l'état du build.
        run: pip install -r requirements-docs.txt

      - name: Français
        run: python -m sphinx -b html -W --keep-going docs/site/fr _site/fr

      - name: English
        run: python -m sphinx -b html -W --keep-going docs/site/en _site/en

      - name: Page d'accueil bilingue
        run: cp docs/site/root-index.html _site/index.html

      - name: Préserver la page de mesure mobile
        # `gh-pages` portait la page statique publiée en août pour mesurer
        # depuis un téléphone — le téléphone atteignant internet plutôt que la
        # machine de mesure. Basculer Pages sur Actions la mettrait hors ligne ;
        # elle est donc recopiée sous /mobile/. Rien n'est perdu, et la méthode
        # reste utilisable pour le prochain appareil.
        run: |
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null 2>&1; then
            git fetch --depth 1 origin gh-pages
            mkdir -p _site/mobile
            git archive origin/gh-pages | tar -x -C _site/mobile
          else
            echo "pas de branche gh-pages : rien à préserver"
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
