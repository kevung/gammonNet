<!doctype html>
<meta charset="utf-8">
<title>gammonNet — coût d'une vraie décision</title>
<style>
  body { font: 14px/1.55 ui-monospace, monospace; margin: 2rem; max-width: 54rem; }
  pre { white-space: pre-wrap; }
</style>
<h1>Le coût d'une décision, mesuré</h1>
<pre id="out">…</pre>

<script type="module">
  // T21 a rendu son verdict en multipliant un débit d'évaluations MESURÉ par un
  // nombre d'évaluations par décision, d'abord supposé puis mesuré par T30. Les
  // deux moitiés sont solides ; leur produit reste une projection, parce qu'il
  // suppose que rien d'autre ne coûte — ni la génération des coups, ni
  // l'encodage, ni le parcours de l'arbre.
  //
  // Cette page fait de vraies décisions et les chronomètre. C'est la dernière
  // projection du projet qui devient une mesure.
  const params = new URLSearchParams(location.search);
  const build = params.get("build") === "scalar" ? "gammonnet" : "gammonnet-simd";

  // Position de départ, jet 3-1, et ce que le natif en dit. L'accord est
  // vérifié AVANT de chronométrer : un débit mesuré sur un moteur qui répond
  // faux ne vaut rien.
  const POSITION = { id: "4HPwATDgc/ABMA", turn: 0, d1: 3, d2: 1 };
  const NATIVE = [
    { ply: 0, filterTop: 0, filterInner: 0, equity: 0.165832, evaluations: 16,
      resultId: "sGfwATDgc/ABMA", reps: 200 },
    { ply: 1, filterTop: 0, filterInner: 0, equity: 0.164344, evaluations: 7475,
      resultId: "sGfwATDgc/ABMA", reps: 5 },
    { ply: 2, filterTop: 1, filterInner: 1, equity: 0.166899, evaluations: 12951,
      resultId: "sGfwATDgc/ABMA", reps: 3 },
    // Le point de fonctionnement de la campagne T35, et le même avec le
    // réseau d'élagage au défaut natif. En natif : 2,0075 s contre 0,5588 s
    // par décision, ×3,9. Ce que ça devient ici est LA question — le gain
    // vient du remplissage des lots, et le lot rend ×2,21 dans un navigateur
    // contre ×8,5 en natif. Rien ne se transporte.
    { ply: 2, filterTop: 3, filterInner: 1, equity: 0.166899, evaluations: 38721,
      resultId: "sGfwATDgc/ABMA", reps: 2, pruneK: 0 },
    { ply: 2, filterTop: 3, filterInner: 1, equity: 0.166899, evaluations: 15142,
      resultId: "sGfwATDgc/ABMA", reps: 3, pruneK: 12 },
  ];

  const out = document.getElementById("out");
  const log = (line) => { out.textContent += line + "\n"; };

  async function report(payload) {
    try {
      await fetch("/report", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify(payload),
      });
    } catch { /* page statique : personne n'écoute */ }
  }

  try {
    const { Evaluator } = await import("/wasm/gammonnet.mjs");
    const { default: factory } = await import(`/build/wasm/${build}.mjs`);
    const modelBytes = new Uint8Array(
      await (await fetch("/models/cubeless_prob5_512_512_256_128.bin")).arrayBuffer(),
    );
    const evaluator = await Evaluator.create(factory, modelBytes);
    // Chargé une fois ; c'est `loadPrune(bytes, k)` qui l'allume ou l'éteint
    // par configuration.
    const pruneBytes = new Uint8Array(
      await (await fetch("/models/prune_32.bin")).arrayBuffer(),
    );

    out.textContent = `build ${build} · SIMD ${evaluator.hasSimd}\n`;
    log("profondeur   ms/décision      éval    accord natif");

    const payload = {
      test: "decision", build, simd: evaluator.hasSimd,
      userAgent: navigator.userAgent,
      hardwareConcurrency: navigator.hardwareConcurrency,
      results: [],
    };

    for (const expected of NATIVE) {
      const options = {
        ply: expected.ply,
        filterTop: expected.filterTop,
        filterInner: expected.filterInner,
      };

      // L'élagage est posé AVANT le contrôle d'accord, pas après : c'est la
      // configuration entière qui doit rendre le compte d'évaluations
      // attendu, élagage compris. Un k qui ne serait pas pris déplacerait ce
      // compte, et le contrôle le dirait au lieu de chronométrer une
      // configuration qui n'est pas celle qu'on croit.
      const wantedK = expected.pruneK || 0;
      evaluator.loadPrune(pruneBytes, wantedK);
      if (evaluator.pruneK() !== wantedK) {
        throw new Error(
          `élagage demandé à k=${wantedK}, en vigueur k=${evaluator.pruneK()}`);
      }

      // L'accord d'abord.
      const first = evaluator.bestPlay(
        POSITION.id, POSITION.turn, POSITION.d1, POSITION.d2, options);
      if (first === null) throw new Error(`décision refusée à ${expected.ply}-ply`);

      const sameMove = first.resultId === expected.resultId;
      const sameCount = first.evaluations === expected.evaluations;
      const equityGap = Math.abs(first.equity - expected.equity);

      // Puis le temps. Médiane, et un tour à blanc écarté.
      const samples = [];
      for (let r = 0; r < expected.reps + 1; r++) {
        const start = performance.now();
        evaluator.bestPlay(
          POSITION.id, POSITION.turn, POSITION.d1, POSITION.d2, options);
        if (r > 0) samples.push(performance.now() - start);
      }
      samples.sort((a, b) => a - b);
      const median = samples[Math.floor(samples.length / 2)];

      if (!(median > 0)) throw new Error("l'horloge n'a pas avancé");

      const verdict = (sameMove && sameCount && equityGap < 1e-5) ? "✅"
        : `❌ coup ${sameMove} · éval ${first.evaluations} · Δéq ${equityGap.toExponential(1)}`;

      payload.results.push({
        ply: expected.ply,
        pruneK: wantedK,
        filter: `${expected.filterTop}/${expected.filterInner}`,
        medianMs: Number(median.toFixed(3)),
        evaluations: first.evaluations,
        equity: first.equity,
        sameMoveAsNative: sameMove,
        sameEvaluationCount: sameCount,
        equityGap,
        // Ce que T21 aurait prédit : le compte d'évaluations multiplié par le
        // coût unitaire mesuré. L'écart au temps réel est le sujet.
        msPerEvaluation: median / first.evaluations,
      });

      const label = expected.ply === 2 ? "2-ply 1/1" : `${expected.ply}-ply`;
      log(`${label.padEnd(12)} ${median.toFixed(2).padStart(11)} ` +
          `${String(first.evaluations).padStart(9)}    ${verdict}`);
    }

    // Le chiffre qui tranche : le coût par évaluation vu à travers une vraie
    // décision, comparé à celui que T21 a mesuré sur des évaluations nues.
    const deep = payload.results[payload.results.length - 1];
    payload.overheadRatio = deep.msPerEvaluation;
    log(`\nms par évaluation, à travers une décision complète : ` +
        `${deep.msPerEvaluation.toFixed(5)}`);
    log(`T21 mesurait 0,0898 ms/évaluation sur des évaluations nues.`);
    log(`Le rapport dit ce que coûtent la génération des coups et l'arbre.`);

    // ── UNE DÉCISION COMPLÈTE, DANS UN WORKER, SANS UNE LIGNE DE RECHERCHE
    //    EN JAVASCRIPT (T86) ────────────────────────────────────────────
    //
    // Tout ce qui précède tourne sur le thread principal. C'est ce qu'un
    // consommateur ne peut PAS faire : une décision de 2,7 s y gèle la page.
    // Et jusqu'à T86, la seule chose que `worker.mjs` savait relayer était un
    // lot de caractéristiques — donc pour obtenir une décision hors du thread
    // principal il fallait engendrer les coups et parcourir l'arbre en
    // JavaScript, c'est-à-dire réécrire la recherche que ce module embarque.
    //
    // Ce bloc est la preuve de bout en bout que ce n'est plus le cas : un
    // Position ID entre, une décision sort, et la seule chose que le
    // JavaScript fait est de poster un message.
    const { EvaluatorPool } = await import("/wasm/pool.mjs");
    const factoryUrl = new URL(`/build/wasm/${build}.mjs`, location.href).href;
    const pool = await EvaluatorPool.create(
      1, new URL("/wasm/worker.mjs", location.href).href, factoryUrl, modelBytes,
      { pruneBytes, pruneK: 12 });
    const REQUEST = { positionId: POSITION.id, turn: POSITION.turn,
                      d1: POSITION.d1, d2: POSITION.d2 };
    const DEEP = { ply: 2, filterTop: 3, filterInner: 1 };

    const workerStart = performance.now();
    const workerJob = pool.decide([REQUEST], { kind: "bestPlay", options: DEEP });
    const [fromWorker] = (await workerJob.done) || [null];
    const workerMs = performance.now() - workerStart;
    if (!fromWorker) throw new Error("le worker n'a rendu aucune décision");

    // Le contrôle qui mord : le worker doit rendre EXACTEMENT ce que le natif
    // rend. Un relais qui transforme n'est pas un relais.
    const deepNative = NATIVE[NATIVE.length - 1];
    const workerAgrees = fromWorker.resultId === deepNative.resultId
      && Math.abs(fromWorker.equity - deepNative.equity) < 1e-5
      && fromWorker.evaluations === deepNative.evaluations;
    payload.worker = {
      ms: Number(workerMs.toFixed(3)),
      resultId: fromWorker.resultId,
      equity: fromWorker.equity,
      evaluations: fromWorker.evaluations,
      agreesWithNative: workerAgrees,
    };
    log(`\ndans un worker ${workerMs.toFixed(2).padStart(12)} ` +
        `${String(fromWorker.evaluations).padStart(9)}    ${workerAgrees ? "✅" : "❌"}`);
    log(`décision complète depuis un Position ID, zéro ligne de recherche en JS.`);

    // Et l'annulation, dans les conditions réelles. Ce qui est vérifié n'est
    // PAS qu'une décision en vol s'arrête — elle ne le peut pas, un appel WASM
    // synchrone n'est pas interruptible sans SharedArrayBuffer — mais que le
    // travail dépassé ne remonte pas ET que le worker reste utilisable, ses
    // 1,06 Mo de poids en place. C'est ce que `Worker.terminate()` ne sait pas
    // faire, et c'est le coût qu'un geste annulé paye aujourd'hui chez le
    // consommateur.
    //
    // Deux décisions sont postées puis annulées. La PREMIÈRE est déjà partie
    // dans le WASM : elle ira au bout, et le mesurer est le sujet — c'est une
    // limite de plateforme constatée, pas supposée. La SECONDE n'a pas encore
    // tourné : elle doit revenir abandonnée. Et le worker doit répondre à une
    // troisième requête sans rien recharger.
    const cancelStart = performance.now();
    const inFlight = pool.decide([REQUEST], { kind: "bestPlay", options: DEEP });
    const queued = pool.decide([REQUEST], { kind: "bestPlay", options: DEEP });
    queued.cancel();
    const [inFlightResult, queuedResult] = await Promise.all([inFlight.done, queued.done]);
    const again = pool.decide([REQUEST], { kind: "bestPlay", options: { ply: 0 } });
    const [reuse] = (await again.done) || [null];
    payload.cancellation = {
      // Attendu FAUX, et c'est le fait à publier : un appel WASM synchrone
      // n'est pas interruptible depuis JavaScript sans SharedArrayBuffer.
      inFlightAbandoned: inFlightResult === null,
      // Attendu VRAI : ce qui n'a pas encore commencé s'annule pour de bon.
      queuedAbandoned: queuedResult === null,
      workerStillWarm: Boolean(reuse),
      ms: Number((performance.now() - cancelStart).toFixed(3)),
    };
    log(`annulation : en vol abandonnée=${inFlightResult === null} ` +
        `(attendu faux — limite de plateforme), ` +
        `en file abandonnée=${queuedResult === null}, ` +
        `worker encore chaud=${Boolean(reuse)} (poids NON rechargés)`);

    pool.destroy();
    evaluator.destroy();
    await report(payload);
  } catch (error) {
    log("❌ " + (error?.stack || error));
    await report({ error: String(error?.stack || error) });
  }
</script>
